  <!DOCTYPE html>
<html lang="fr">

<head>
  <title>Hotspot Zone — Connexion</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta http-equiv="pragma" content="no-cache" />
  <meta http-equiv="expires" content="no-cache" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <div class="portal-bg"></div>


  $(if chap-id)
  <form name="sendin" action="$(link-login-only)" method="post">
    <input type="hidden" name="username" />
    <input type="hidden" name="password" />
    <input type="hidden" name="dst" value="$(link-orig)" />
    <input type="hidden" name="popup" value="true" />
  </form>
  <script type="text/javascript" src="/md5.js"></script>
  <script type="text/javascript">

    function doLogin() {
      document.sendin.username.value = document.login.username.value;
      document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
      document.sendin.submit();
      return false;
    }
  </script>
  $(endif)

  <div class="wrap">
    <div class="brand-top">Hotspot<span>Zone</span></div>

    <div class="card">
      <div class="card-head">
        <h1>Bienvenue !</h1>
        <p>Connectez-vous pour accéder à Internet</p>
      </div>

      <!-- Message d'erreur MikroTik -->
      $(if error)
      <div class="status-msg error show">$(error)</div>
      $(endif)

      <!-- Offre d'accès trial -->
      $(if trial == 'yes')
      <div class="trial-banner">
        Accès disponible —
        <a href="$(link-login-only)?dst=$(link-orig-esc)&username=T-$(mac-esc)">Cliquez ici</a>
      </div>
      $(endif)

      <!-- Formulaire de connexion (back-end intact) -->
      <form name="login" action="$(link-login-only)" method="post" class="portal-form" $(if chap-id)
        onsubmit="return doLogin()" $(endif)>

        <input type="hidden" name="dst" value="$(link-orig)" />
        <input type="hidden" name="popup" value="true" />

        <div class="field">
          <div class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <input type="text" name="username" id="username" placeholder="Nom d'utilisateur" value="$(username)"
              autocomplete="username" />
          </div>
        </div>

        <div class="field">
          <div class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input type="password" name="password" id="password" placeholder="Mot de passe"
              autocomplete="current-password" />
          </div>
        </div>

        <button type="submit" class="btn-primary" id="btn-login">Se connecter</button>
      </form>

      <p class="terms">
        En vous connectant, vous acceptez nos
        <a href="$(link-login-only)?target=lv&dst=$(link-orig-esc)">conditions d'utilisation</a>.
      </p>
    </div>

    <div class="footer">Hotspot Zone · Accès Internet</div>
  </div>

  <script type="text/javascript">

    document.getElementById('username').focus();

  </script>

</body>

</html>
